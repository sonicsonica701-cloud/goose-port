name: Build Android APK (ARMv7)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  UNITY_VERSION: 2020.3.48f1
  TARGET_PLATFORM: Android
  BUILD_NAME: UntitledGooseGame

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Download project tarball
        run: |
          ASSET_ID=$(cat project_asset_id.txt)
          curl -L -H "Authorization: Bearer ${{ secrets.PROJECT_PAT }}" \
               -H "Accept: application/octet-stream" \
               "https://api.github.com/repos/sonicsonica701-cloud/goose-port/releases/assets/$ASSET_ID" \
               -o project.tar.zst
          echo "Downloaded tarball"

      - name: Extract project
        run: |
          pip install zstandard
          python3 -c "
          import zstandard, tarfile, io
          dctx = zstandard.ZstdDecompressor()
          with open('project.tar.zst', 'rb') as ifh:
              with dctx.stream_reader(ifh) as reader:
                  with tarfile.open(fileobj=reader, mode='r|') as tar:
                      tar.extractall('.')
          "
          rm project.tar.zst
          ls -la ExportedProject/
          echo "Project extracted"

      - name: Apply overrides
        run: |
          if [ -d "overrides" ]; then
            cp -rv overrides/* ExportedProject/ 2>/dev/null || true
            echo "Overrides applied"
          fi

      - name: Set Android build settings
        run: |
          # Patch ProjectSettings for ARMv7 32-bit Android
          SETTINGS="ExportedProject/ProjectSettings/ProjectSettings.asset"
          if [ -f "$SETTINGS" ]; then
            # Force ARMv7 only (no ARM64)
            sed -i 's/AndroidTargetArchitectures:.*/AndroidTargetArchitectures: 1/' "$SETTINGS"
            # Set minimum API level to 22 (Android 5.1)
            sed -i 's/AndroidMinSdkVersion:.*/AndroidMinSdkVersion: 22/' "$SETTINGS"
            # Set target API to 28 (matches test device)
            sed -i 's/AndroidTargetSdkVersion:.*/AndroidTargetSdkVersion: 28/' "$SETTINGS"
            # Force Mono scripting backend (not IL2CPP)
            sed -i 's/scriptingBackend:.*/scriptingBackend: {Android: 0}/' "$SETTINGS"
            # Set bundle identifier
            sed -i 's/applicationIdentifier:.*//' "$SETTINGS"
            echo "Build settings patched for ARMv7"
          fi

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ExportedProject
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildName: ${{ env.BUILD_NAME }}
          androidAppBundle: false
          androidKeystoreName: ''
          buildMethod: ''
          versioning: Custom
          version: 0.1.0

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goose-apk
          path: build/Android/*.apk
          retention-days: 14
