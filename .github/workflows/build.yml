name: Build Android APK (ARMv7)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h

      - name: Download project tarball
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: |
          set -e
          ASSET_ID=$(cat project_asset_id.txt)
          curl -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${ASSET_ID}" \
            -o project.tar.zst
          ls -lh project.tar.zst
          zstd -d project.tar.zst -o project.tar
          rm project.tar.zst
          tar -xf project.tar
          rm project.tar
          ls -la ExportedProject/
          df -h

      - name: Apply overrides
        run: |
          set -e
          if [ -d overrides ]; then
            echo "Applying overrides:"
            (cd overrides && find . -type f) | sed 's|^|  |'
            cp -rv overrides/* ExportedProject/ | tail -20
          fi

      - name: Pull Unity Android editor image
        run: docker pull unityci/editor:ubuntu-2020.3.48f1-android-3

      - name: Activate Unity + Build APK
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          set -e
          echo "UNITY_EMAIL=$UNITY_EMAIL" > /tmp/u.env
          echo "UNITY_PASSWORD=$UNITY_PASSWORD" >> /tmp/u.env
          
          # If we have a UNITY_LICENSE (ULF content), write it directly
          if [ -n "$UNITY_LICENSE" ]; then
            echo "Using provided UNITY_LICENSE (ULF)..."
            mkdir -p license_dir
            echo "$UNITY_LICENSE" > license_dir/Unity_lic.ulf
            echo "UNITY_LICENSE_FILE=/license/Unity_lic.ulf" >> /tmp/u.env
          fi
          
          docker run --rm \
            --env-file /tmp/u.env \
            -v "$PWD/ExportedProject":/project \
            -v "$PWD/license_dir":/license 2>/dev/null || true \
            -w /project \
            unityci/editor:ubuntu-2020.3.48f1-android-3 \
            bash -c '
              set +e
              echo "=== Attempting license activation ==="
              
              # If ULF file exists, install it directly
              if [ -f "/license/Unity_lic.ulf" ]; then
                echo "Installing ULF license file..."
                mkdir -p /root/.local/share/unity3d/Unity
                cp /license/Unity_lic.ulf /root/.local/share/unity3d/Unity/Unity_lic.ulf
                mkdir -p /root/.config/unity3d/Unity/licenses
                cp /license/Unity_lic.ulf /root/.config/unity3d/Unity/licenses/Unity_lic.ulf
              fi
              
              # Try licensing client activation
              LIC_CLIENT=$(find /opt/unity -name "Unity.Licensing.Client" -type f 2>/dev/null | head -1)
              if [ -n "$LIC_CLIENT" ] && [ -n "$UNITY_EMAIL" ]; then
                echo "Trying licensing client..."
                "$LIC_CLIENT" --activate-all --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" || true
              fi
              
              # Check what we got
              echo "=== License state ==="
              ls -la /root/.config/unity3d/Unity/licenses/ 2>/dev/null || true
              ls -la /root/.local/share/unity3d/Unity/ 2>/dev/null || true
              
              echo "=== Building APK ==="
              set -e
              /opt/unity/Editor/Unity \
                -batchmode -nographics -quit \
                -username "$UNITY_EMAIL" \
                -password "$UNITY_PASSWORD" \
                -projectPath /project \
                -executeMethod AndroidBuilder.BuildAndroid \
                -logFile /dev/stdout \
                -buildTarget Android
              
              echo "=== Build complete ==="
              ls -la /project/Build/ || true
              chown -R $(stat -c "%u:%g" /project) /project/Build || true
            '

      - name: Generate ALF (if build failed due to licensing)
        if: failure()
        run: |
          echo "Build may have failed due to licensing. Generating ALF for manual activation..."
          docker run --rm \
            -v "$PWD/ExportedProject":/project \
            -w /project \
            unityci/editor:ubuntu-2020.3.48f1-android-3 \
            bash -c '
              /opt/unity/Editor/Unity -batchmode -nographics -quit -createManualActivationFile -logFile /dev/stdout || true
            '
          find ExportedProject -name "*.alf" -exec cp {} ./Unity_v2020.3.48f1.alf \; 2>/dev/null || true
          ls -la *.alf 2>/dev/null || echo "No ALF generated"

      - name: Upload ALF (for manual activation)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: "*.alf"
          if-no-files-found: ignore

      - name: List build output
        if: always()
        run: |
          sudo chown -R $USER:$USER ExportedProject/Build 2>/dev/null || true
          ls -la ExportedProject/Build/ || true
          find ExportedProject/Build -name "*.apk" -ls || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goose-apk
          path: ExportedProject/Build/*.apk
          if-no-files-found: ignore
          retention-days: 14
