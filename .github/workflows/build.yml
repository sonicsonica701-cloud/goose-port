name: Build Untitled Goose Game Android APK (ARMv7)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h

      - name: Install zstd
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd

      - name: Download project tarball from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ASSET_ID=$(cat project_asset_id.txt)
          echo "Downloading asset $ASSET_ID..."
          curl -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${ASSET_ID}" \
            -o project.tar.zst
          ls -lh project.tar.zst
          zstd -d project.tar.zst -o project.tar
          rm project.tar.zst
          tar -xf project.tar
          rm project.tar
          ls -la ExportedProject/
          df -h

      - name: Apply local overrides
        run: |
          set -e
          if [ -d overrides ]; then
            echo "Applying overrides:"
            (cd overrides && find . -type f) | sed 's|^|  |'
            cp -rv overrides/* ExportedProject/ | tail -20
          fi

      - name: Pull Unity Android editor image
        run: docker pull unityci/editor:ubuntu-2020.3.48f1-android-3

      - name: Build APK with pre-activated license
        run: |
          set -e
          echo "=== Injecting license file ==="
          ls -la UnityEntitlementLicense.xml
          grep -o "com.unity.editor[^\"]*" UnityEntitlementLicense.xml || true

          docker run --rm \
            -v "$PWD/ExportedProject":/project \
            -v "$PWD/UnityEntitlementLicense.xml":/root/.config/unity3d/Unity/licenses/UnityEntitlementLicense.xml:ro \
            -w /project \
            unityci/editor:ubuntu-2020.3.48f1-android-3 \
            bash -c '
              echo "=== License verification ==="
              ls -la /root/.config/unity3d/Unity/licenses/
              grep -o "com.unity.editor[^\"]*" /root/.config/unity3d/Unity/licenses/UnityEntitlementLicense.xml || true
              echo "=== Machine ID check ==="
              cat /etc/machine-id 2>/dev/null || echo "no machine-id"

              echo "=== Running Unity build ==="
              /opt/unity/Editor/Unity \
                -batchmode -nographics -quit \
                -projectPath /project \
                -executeMethod AndroidBuilder.BuildAndroid \
                -logFile /dev/stdout \
                -buildTarget Android
              echo "=== Build artifacts ==="
              ls -la /project/Build/ || true
              chown -R $(stat -c "%u:%g" /project) /project/Build || true
            '

      - name: List build output
        if: always()
        run: |
          sudo chown -R $USER:$USER ExportedProject/Build 2>/dev/null || true
          ls -la ExportedProject/Build/ || true
          find ExportedProject/Build -name '*.apk' -ls || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UntitledGooseGame-APK
          path: ExportedProject/Build/*.apk
          if-no-files-found: error
