name: Build Android APK (ARMv7)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android /opt/hostedtoolcache
          df -h

      - name: Download project tarball
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: |
          set -e
          ASSET_ID=$(cat project_asset_id.txt)
          curl -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${ASSET_ID}" \
            -o project.tar.zst
          ls -lh project.tar.zst
          zstd -d project.tar.zst -o project.tar
          rm project.tar.zst
          tar -xf project.tar
          rm project.tar
          ls -la ExportedProject/

      - name: Apply overrides
        run: |
          set -e
          if [ -d overrides ]; then
            cp -rv overrides/* ExportedProject/ | tail -20
          fi

      - name: Install Unity Hub and Unity Editor
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -e
          # Dependencies
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgbm1 libasound2 libgtk-3-0 libnss3 libxss1
          
          # Install Unity Hub
          wget -qO - https://hub.unity3d.com/linux/keys/public | sudo gpg --dearmor -o /etc/apt/keyrings/unity-hub.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/unity-hub.gpg] https://hub.unity3d.com/linux/repos/deb stable main" | sudo tee /etc/apt/sources.list.d/unityhub.list
          sudo apt-get update -qq
          sudo apt-get install -y unityhub
          
          # Start Xvfb on display :1 (not :99 which may conflict)
          sudo Xvfb :1 -screen 0 1024x768x24 -ac &
          export DISPLAY=:1
          sleep 3
          
          # Check what commands are available
          echo "=== Unity Hub help ==="
          unityhub --no-sandbox -- --headless help 2>&1 || true
          
          # Install Unity editor
          echo "=== Installing Unity 2020.3.48f1 ==="
          unityhub --no-sandbox -- --headless install -v 2020.3.48f1 -m android 2>&1 || \
          unityhub --no-sandbox -- --headless install --version 2020.3.48f1 --module android 2>&1 || \
          echo "Install command failed, trying alternate syntax..."
          
          # Show installed editors
          unityhub --no-sandbox -- --headless editors -i 2>&1 || \
          unityhub --no-sandbox -- --headless editors --installed 2>&1 || true
          
          # List what was installed
          find / -name "Unity" -type f -path "*/Editor/Unity" 2>/dev/null || true
          echo "Done with Unity install step"

      - name: Activate License
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          export DISPLAY=:1
          echo "=== Activating Personal License ==="
          # Try the Hub license command
          unityhub --no-sandbox -- --headless license -a -u "$UNITY_EMAIL" -p "$UNITY_PASSWORD" -t personal 2>&1 || \
          unityhub --no-sandbox -- --headless license activate -u "$UNITY_EMAIL" -p "$UNITY_PASSWORD" --type personal 2>&1 || \
          echo "Hub license activation failed, will try editor -username -password"
          
          # Fallback: use Unity editor directly with credentials
          UNITY=$(find / -name "Unity" -type f -path "*/Editor/Unity" 2>/dev/null | head -1)
          if [ -n "$UNITY" ]; then
            echo "Trying direct editor activation..."
            "$UNITY" -batchmode -nographics -quit \
              -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" \
              -logFile - 2>&1 | tail -30 || true
          fi
          echo "License step done"

      - name: Build APK
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          export DISPLAY=:1
          UNITY=$(find / -name "Unity" -type f -path "*/Editor/Unity" 2>/dev/null | head -1)
          echo "Unity editor: $UNITY"
          
          if [ -z "$UNITY" ]; then
            echo "ERROR: Unity editor not found!"
            find / -path "*/2020*" -name "Unity" 2>/dev/null || true
            exit 1
          fi
          
          "$UNITY" \
            -batchmode -nographics -quit \
            -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" \
            -projectPath "$PWD/ExportedProject" \
            -executeMethod AndroidBuilder.BuildAndroid \
            -logFile - \
            -buildTarget Android
          
          echo "=== Build output ==="
          ls -la ExportedProject/Build/
          find ExportedProject/Build -name "*.apk" -ls

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goose-apk
          path: ExportedProject/Build/*.apk
          if-no-files-found: error
          retention-days: 14
