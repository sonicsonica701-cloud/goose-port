name: Build Android APK (ARMv7)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h

      - name: Download project tarball
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: |
          set -e
          ASSET_ID=$(cat project_asset_id.txt)
          curl -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${ASSET_ID}" \
            -o project.tar.zst
          ls -lh project.tar.zst
          zstd -d project.tar.zst -o project.tar
          rm project.tar.zst
          tar -xf project.tar
          rm project.tar
          ls -la ExportedProject/
          df -h

      - name: Apply overrides
        run: |
          set -e
          if [ -d overrides ]; then
            echo "Applying overrides:"
            (cd overrides && find . -type f) | sed 's|^|  |'
            cp -rv overrides/* ExportedProject/ | tail -20
          fi

      - name: Install Unity Hub
        run: |
          wget -qO - https://hub.unity3d.com/linux/keys/public | sudo gpg --dearmor -o /etc/apt/keyrings/unity-hub.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/unity-hub.gpg] https://hub.unity3d.com/linux/repos/deb stable main" | sudo tee /etc/apt/sources.list.d/unityhub.list
          sudo apt-get update -qq
          sudo apt-get install -y unityhub
          # Make xvfb available for headless Unity Hub
          sudo apt-get install -y xvfb

      - name: Install Unity 2020.3.48f1 with Android support
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 2
          # Login to Unity Hub
          xvfb-run unityhub --headless login --username "${{ secrets.UNITY_EMAIL }}" --password "${{ secrets.UNITY_PASSWORD }}"
          # Install Unity with Android build support
          xvfb-run unityhub --headless install --version 2020.3.48f1 --module android --childModules
          # List installs to verify
          xvfb-run unityhub --headless editors --installed
          echo "Unity installed!"

      - name: Activate Unity License
        run: |
          export DISPLAY=:99
          xvfb-run unityhub --headless license activate --username "${{ secrets.UNITY_EMAIL }}" --password "${{ secrets.UNITY_PASSWORD }}" --type personal
          echo "License activated!"

      - name: Find Unity Editor path
        id: unity-path
        run: |
          UNITY_PATH=$(find /opt/unityhub -name "Unity" -type f -path "*/Editor/Unity" 2>/dev/null || find ~/Unity -name "Unity" -type f -path "*/Editor/Unity" 2>/dev/null || find /home -name "Unity" -type f -path "*/Editor/Unity" 2>/dev/null)
          echo "UNITY_EDITOR=$UNITY_PATH" >> $GITHUB_OUTPUT
          echo "Found Unity at: $UNITY_PATH"

      - name: Build APK
        run: |
          export DISPLAY=:99
          UNITY="${{ steps.unity-path.outputs.UNITY_EDITOR }}"
          if [ -z "$UNITY" ]; then
            echo "Searching for Unity editor..."
            UNITY=$(find / -name "Unity" -type f -path "*/Editor/Unity" 2>/dev/null | head -1)
          fi
          echo "Using Unity at: $UNITY"
          
          "$UNITY" \
            -batchmode -nographics -quit \
            -projectPath "$PWD/ExportedProject" \
            -executeMethod AndroidBuilder.BuildAndroid \
            -logFile - \
            -buildTarget Android
          
          echo "=== Build output ==="
          ls -la ExportedProject/Build/ || true
          find ExportedProject/Build -name "*.apk" -ls || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goose-apk
          path: ExportedProject/Build/*.apk
          if-no-files-found: error
          retention-days: 14
