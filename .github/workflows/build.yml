name: Build Untitled Goose Game Android APK (ARMv7)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h

      - name: Install zstd
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd

      - name: Download project tarball from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ASSET_ID=$(cat project_asset_id.txt)
          echo "Downloading asset $ASSET_ID..."
          curl -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${ASSET_ID}" \
            -o project.tar.zst
          ls -lh project.tar.zst
          zstd -d project.tar.zst -o project.tar
          rm project.tar.zst
          tar -xf project.tar
          rm project.tar
          ls -la ExportedProject/
          df -h

      - name: Apply local overrides
        run: |
          set -e
          if [ -d overrides ]; then
            echo "Applying overrides:"
            (cd overrides && find . -type f) | sed 's|^|  |'
            cp -rv overrides/* ExportedProject/ | tail -20
          fi

      - name: Pull Unity Android editor image
        run: docker pull unityci/editor:ubuntu-2020.3.48f1-android-3

      - name: Activate Unity + Build APK
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -e
          echo "email md5: $(echo -n "$UNITY_EMAIL" | md5sum | cut -d' ' -f1)"
          echo "pass md5: $(echo -n "$UNITY_PASSWORD" | md5sum | cut -d' ' -f1)"
          docker run --rm \
            -e "UNITY_EMAIL=$UNITY_EMAIL" \
            -e "UNITY_PASSWORD=$UNITY_PASSWORD" \
            -v "$PWD/ExportedProject":/project \
            -w /project \
            unityci/editor:ubuntu-2020.3.48f1-android-3 \
            bash -c '
              set +e
              LIC_CLIENT=$(find /opt/unity -name "Unity.Licensing.Client" -type f 2>/dev/null | head -1)
              echo "licensing client: $LIC_CLIENT"

              # Step 1: Deactivate all existing seats so this machine can claim one
              echo "=== Deactivating all existing seats ==="
              "$LIC_CLIENT" --deactivate-all --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD"
              echo "deactivate-all exit: $?"
              sleep 3

              # Step 2: Activate on this machine (fresh seat available now)
              echo "=== Activating Unity on this machine ==="
              "$LIC_CLIENT" --activate-all --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD"
              echo "activate-all exit: $?"

              # Step 3: Verify
              "$LIC_CLIENT" --showEntitlements
              echo "=== License files ==="
              ls -la /root/.config/unity3d/Unity/licenses/ 2>/dev/null || echo "no license dir"

              # Step 4: Build
              if [ -f /root/.config/unity3d/Unity/licenses/UnityEntitlementLicense.xml ]; then
                echo "=== License OK, building without creds ==="
                set -e
                /opt/unity/Editor/Unity \
                  -batchmode -nographics -quit \
                  -projectPath /project \
                  -executeMethod AndroidBuilder.BuildAndroid \
                  -logFile /dev/stdout \
                  -buildTarget Android
              else
                echo "=== No license file, building with creds ==="
                set -e
                /opt/unity/Editor/Unity \
                  -batchmode -nographics -quit \
                  -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" \
                  -projectPath /project \
                  -executeMethod AndroidBuilder.BuildAndroid \
                  -logFile /dev/stdout \
                  -buildTarget Android
              fi

              echo "=== Build artifacts ==="
              ls -la /project/Build/ || true
              chown -R $(stat -c "%u:%g" /project) /project/Build || true
            '

      - name: List build output
        if: always()
        run: |
          sudo chown -R $USER:$USER ExportedProject/Build 2>/dev/null || true
          ls -la ExportedProject/Build/ || true
          find ExportedProject/Build -name '*.apk' -ls || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UntitledGooseGame-APK
          path: ExportedProject/Build/*.apk
          if-no-files-found: error
