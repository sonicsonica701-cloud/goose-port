name: Build Android APK (ARMv7)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  UNITY_VERSION: 2020.3.48f1
  TARGET_PLATFORM: Android
  BUILD_NAME: UntitledGooseGame

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Download project tarball
        run: |
          ASSET_ID=$(cat project_asset_id.txt)
          curl -L -H "Authorization: Bearer ${{ secrets.PROJECT_PAT }}" \
               -H "Accept: application/octet-stream" \
               "https://api.github.com/repos/sonicsonica701-cloud/goose-port/releases/assets/$ASSET_ID" \
               -o project.tar.zst
          ls -lh project.tar.zst
          echo "Downloaded tarball"

      - name: Extract project
        run: |
          zstd -d project.tar.zst -o project.tar
          tar -xf project.tar
          rm project.tar project.tar.zst
          ls -la ExportedProject/
          echo "Project extracted"

      - name: Apply overrides
        run: |
          if [ -d "overrides" ]; then
            cp -rv overrides/* ExportedProject/ 2>/dev/null || true
            echo "Overrides applied"
          fi

      - name: Set Android build settings
        run: |
          SETTINGS="ExportedProject/ProjectSettings/ProjectSettings.asset"
          if [ -f "$SETTINGS" ]; then
            sed -i 's/AndroidTargetArchitectures:.*/AndroidTargetArchitectures: 1/' "$SETTINGS"
            sed -i 's/AndroidMinSdkVersion:.*/AndroidMinSdkVersion: 22/' "$SETTINGS"
            sed -i 's/AndroidTargetSdkVersion:.*/AndroidTargetSdkVersion: 28/' "$SETTINGS"
            sed -i 's/scriptingBackend:.*/scriptingBackend: {Android: 0}/' "$SETTINGS"
            echo "Build settings patched for ARMv7 32-bit"
          fi

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ExportedProject
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildName: ${{ env.BUILD_NAME }}
          androidExportType: androidPackage
          versioning: Custom
          version: 0.1.0

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goose-apk
          path: build/Android/*.apk
          retention-days: 14
