name: Build Android APK (ARMv7)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android /opt/hostedtoolcache
          df -h

      - name: Download project tarball
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: |
          set -e
          ASSET_ID=$(cat project_asset_id.txt)
          curl -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${ASSET_ID}" \
            -o project.tar.zst
          ls -lh project.tar.zst
          zstd -d project.tar.zst -o project.tar
          rm project.tar.zst
          tar -xf project.tar
          rm project.tar
          ls -la ExportedProject/

      - name: Apply overrides
        run: |
          set -e
          if [ -d overrides ]; then
            cp -rv overrides/* ExportedProject/ | tail -20
          fi

      - name: Install Unity Hub + Unity 2020.3.48f1
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -e
          # Install deps
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgbm1 libasound2
          
          # Install Unity Hub
          wget -qO - https://hub.unity3d.com/linux/keys/public | sudo gpg --dearmor -o /etc/apt/keyrings/unity-hub.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/unity-hub.gpg] https://hub.unity3d.com/linux/repos/deb stable main" | sudo tee /etc/apt/sources.list.d/unityhub.list
          sudo apt-get update -qq
          sudo apt-get install -y unityhub
          
          # Start virtual display
          Xvfb :99 -screen 0 1024x768x24 &
          export DISPLAY=:99
          sleep 2
          
          # Login
          echo "Logging in..."
          unityhub --no-sandbox --headless login --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD"
          
          # Install Unity with Android module
          echo "Installing Unity 2020.3.48f1 + Android..."
          unityhub --no-sandbox --headless install --version 2020.3.48f1 --module android --childModules
          
          # Verify
          unityhub --no-sandbox --headless editors --installed
          
          # Activate license
          echo "Activating license..."
          unityhub --no-sandbox --headless license activate --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" --type personal
          echo "Done!"

      - name: Build APK
        run: |
          export DISPLAY=:99
          # Find the Unity editor
          UNITY=$(find /root /home /opt -name "Unity" -type f -path "*/2020.3.48f1/Editor/Unity" 2>/dev/null | head -1)
          if [ -z "$UNITY" ]; then
            UNITY=$(find / -name "Unity" -type f -path "*/Editor/Unity" 2>/dev/null | head -1)
          fi
          echo "Unity editor: $UNITY"
          
          "$UNITY" \
            -batchmode -nographics -quit \
            -projectPath "$PWD/ExportedProject" \
            -executeMethod AndroidBuilder.BuildAndroid \
            -logFile - \
            -buildTarget Android
          
          ls -la ExportedProject/Build/
          find ExportedProject/Build -name "*.apk" -ls

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goose-apk
          path: ExportedProject/Build/*.apk
          if-no-files-found: error
          retention-days: 14
