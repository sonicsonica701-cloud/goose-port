name: Build Untitled Goose Game Android APK (ARMv7)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h

      - name: Install zstd
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd

      - name: Download project tarball from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ASSET_ID=$(cat project_asset_id.txt)
          echo "Downloading asset $ASSET_ID..."
          curl -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${ASSET_ID}" \
            -o project.tar.zst
          ls -lh project.tar.zst
          zstd -d project.tar.zst -o project.tar
          rm project.tar.zst
          tar -xf project.tar
          rm project.tar
          ls -la ExportedProject/
          df -h

      - name: Apply local overrides
        run: |
          set -e
          if [ -d overrides ]; then
            echo "Applying overrides:"
            (cd overrides && find . -type f) | sed 's|^|  |'
            cp -rv overrides/* ExportedProject/ | tail -20
          fi

      - name: Pull Unity Android editor image
        run: docker pull unityci/editor:ubuntu-2020.3.48f1-android-3

      - name: Activate Unity Personal (online) + Build APK
        env:
          UNITY_EMAIL: badamsgaming1977@gmail.com
          UNITY_PASSWORD: Sonic260987GHS@
        run: |
          set -e
          # Write creds to env file exactly like castle-port does
          echo "UNITY_EMAIL=badamsgaming1977@gmail.com" > /tmp/u.env
          echo "UNITY_PASSWORD=$UNITY_PASSWORD" >> /tmp/u.env
          echo "creds file lines: $(wc -l < /tmp/u.env)"
          docker run --rm \
            --env-file /tmp/u.env \
            -v "$PWD/ExportedProject":/project \
            -w /project \
            unityci/editor:ubuntu-2020.3.48f1-android-3 \
            bash -c '
              set +e
              echo "=== Activating Unity (online personal) ==="
              LIC_CLIENT=$(find /opt/unity -name "Unity.Licensing.Client" -type f 2>/dev/null | head -1)
              echo "licensing client: $LIC_CLIENT"
              if [ -z "$LIC_CLIENT" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
                echo "FATAL: missing license client or credentials"; exit 1
              fi
              "$LIC_CLIENT" --activate-all --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD"
              echo "activate-all exit: $?"
              "$LIC_CLIENT" --showEntitlements
              echo "=== License file in container ==="
              ls -la /root/.config/unity3d/Unity/licenses/ || true

              echo "=== Running Unity build ==="
              set -e
              /opt/unity/Editor/Unity \
                -batchmode -nographics -quit \
                -projectPath /project \
                -executeMethod AndroidBuilder.BuildAndroid \
                -logFile /dev/stdout \
                -buildTarget Android
              echo "=== Build artifacts ==="
              ls -la /project/Build/ || true
              chown -R $(stat -c "%u:%g" /project) /project/Build || true
            '

      - name: List build output
        if: always()
        run: |
          sudo chown -R $USER:$USER ExportedProject/Build 2>/dev/null || true
          ls -la ExportedProject/Build/ || true
          find ExportedProject/Build -name '*.apk' -ls || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UntitledGooseGame-APK
          path: ExportedProject/Build/*.apk
          if-no-files-found: error
