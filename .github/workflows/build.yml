name: Build Android APK (ARMv7)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android /opt/hostedtoolcache
          df -h

      - name: Download project tarball
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: |
          set -e
          ASSET_ID=$(cat project_asset_id.txt)
          curl -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${ASSET_ID}" \
            -o project.tar.zst
          ls -lh project.tar.zst
          zstd -d project.tar.zst -o project.tar
          rm project.tar.zst
          tar -xf project.tar
          rm project.tar
          ls -la ExportedProject/

      - name: Apply overrides
        run: |
          set -e
          if [ -d overrides ]; then
            cp -rv overrides/* ExportedProject/ | tail -20
          fi

      - name: Install Unity 2020.3.48f1 + Android (direct download)
        run: |
          set -e
          # Download Unity editor directly from Unity's CDN (no Hub needed for install)
          # Changeset: b805b124c6b7
          echo "Downloading Unity 2020.3.48f1 Linux editor..."
          wget -q "https://download.unity3d.com/download_unity/b805b124c6b7/LinuxEditorInstaller/Unity-2020.3.48f1.tar.xz" -O /tmp/unity.tar.xz || \
          wget -q "https://download.unity3d.com/download_unity/b805b124c6b7/LinuxEditorInstaller/Unity.tar.xz" -O /tmp/unity.tar.xz
          
          echo "Extracting Unity editor..."
          sudo mkdir -p /opt/unity
          sudo tar -xf /tmp/unity.tar.xz -C /opt/unity
          rm /tmp/unity.tar.xz
          
          # Find editor
          UNITY=$(find /opt/unity -name "Unity" -type f -path "*/Editor/Unity" | head -1)
          echo "Unity editor at: $UNITY"
          "$UNITY" -version || true
          
          # Download Android support module
          echo "Downloading Android build support..."
          wget -q "https://download.unity3d.com/download_unity/b805b124c6b7/MacEditorTargetInstaller/UnitySetup-Android-Support-for-Editor-2020.3.48f1.pkg" -O /tmp/android.pkg 2>/dev/null || \
          wget -q "https://download.unity3d.com/download_unity/b805b124c6b7/LinuxEditorTargetInstaller/UnitySetup-Android-Support-for-Editor-2020.3.48f1.tar.xz" -O /tmp/android.tar.xz 2>/dev/null || \
          echo "Direct Android module download may need alternate path"
          
          if [ -f /tmp/android.tar.xz ]; then
            sudo tar -xf /tmp/android.tar.xz -C /opt/unity
            rm /tmp/android.tar.xz
          fi
          
          # Check for Android tools
          find /opt/unity -name "*.jar" -path "*android*" 2>/dev/null | head -5 || true
          echo "Unity install done"

      - name: Install Unity Hub for license activation
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgbm1
          
          wget -qO - https://hub.unity3d.com/linux/keys/public | sudo gpg --dearmor -o /etc/apt/keyrings/unity-hub.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/unity-hub.gpg] https://hub.unity3d.com/linux/repos/deb stable main" | sudo tee /etc/apt/sources.list.d/unityhub.list
          sudo apt-get update -qq
          sudo apt-get install -y unityhub
          
          # Start Xvfb
          Xvfb :1 -screen 0 1024x768x24 -ac +extension GLX +render -noreset &
          export DISPLAY=:1
          sleep 3
          
          # Point Hub at our manually installed editor
          UNITY_DIR=$(find /opt/unity -name "Unity" -type f -path "*/Editor/Unity" -exec dirname {} \; | head -1)
          EDITOR_ROOT=$(dirname "$UNITY_DIR")
          echo "Registering editor at: $EDITOR_ROOT"
          unityhub --no-sandbox -- --headless editors --add "$EDITOR_ROOT" 2>&1 || true
          unityhub --no-sandbox -- --headless editors -i 2>&1 || true
          
          # Activate license
          echo "=== Activating license ==="
          unityhub --no-sandbox -- --headless license -a -u "$UNITY_EMAIL" -p "$UNITY_PASSWORD" -t personal 2>&1 || true
          
          # Check license files
          find /root -name "*.xml" -path "*license*" 2>/dev/null || true
          find /home -name "*.xml" -path "*license*" 2>/dev/null || true
          find $HOME -name "*.xml" -path "*license*" 2>/dev/null || true
          echo "License step done"

      - name: Build APK
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          export DISPLAY=:1
          UNITY=$(find /opt/unity -name "Unity" -type f -path "*/Editor/Unity" | head -1)
          echo "Unity editor: $UNITY"
          
          "$UNITY" \
            -batchmode -nographics -quit \
            -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" \
            -projectPath "$PWD/ExportedProject" \
            -executeMethod AndroidBuilder.BuildAndroid \
            -logFile - \
            -buildTarget Android
          
          echo "=== Build output ==="
          ls -la ExportedProject/Build/
          find ExportedProject/Build -name "*.apk" -ls

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goose-apk
          path: ExportedProject/Build/*.apk
          if-no-files-found: error
          retention-days: 14
