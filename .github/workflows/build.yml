name: Build Untitled Goose Game Android APK (ARMv7)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h

      - name: Install zstd
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd

      - name: Download project tarball from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ASSET_ID=$(cat project_asset_id.txt)
          echo "Downloading asset $ASSET_ID..."
          curl -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${ASSET_ID}" \
            -o project.tar.zst
          ls -lh project.tar.zst
          zstd -d project.tar.zst -o project.tar
          rm project.tar.zst
          tar -xf project.tar
          rm project.tar
          ls -la ExportedProject/
          df -h

      - name: Apply local overrides
        run: |
          set -e
          if [ -d overrides ]; then
            echo "Applying overrides:"
            (cd overrides && find . -type f) | sed 's|^|  |'
            cp -rv overrides/* ExportedProject/ | tail -30
          fi

      - name: Fix deprecated API calls
        run: |
          set -e
          echo "=== Fixing deprecated Graphics.DrawProceduralIndirect ==="
          DOF_FILE="ExportedProject/Assets/Plugins/Assembly-CSharp-firstpass/UnityStandardAssets/ImageEffects/DepthOfField.cs"
          if [ -f "$DOF_FILE" ]; then
            sed -i 's/Graphics\.DrawProceduralIndirect(/Graphics.DrawProceduralIndirectNow(/g' "$DOF_FILE"
            echo "Fixed DepthOfField.cs"
          else
            find ExportedProject -name "DepthOfField.cs" -exec sed -i 's/Graphics\.DrawProceduralIndirect(/Graphics.DrawProceduralIndirectNow(/g' {} \; -print
          fi

      - name: Fix FMOD native plugin meta files for Android
        run: |
          set -e
          echo "=== Fixing FMOD .so plugin meta files for Android ==="
          # Find all FMOD .so files and fix their .meta to enable Android platform
          find ExportedProject/Assets -name "libfmod*.so" -o -name "libfmodstudio*.so" | while read SO_FILE; do
            META_FILE="${SO_FILE}.meta"
            echo "Found: $SO_FILE"
            if [ -f "$META_FILE" ]; then
              echo "  Fixing meta: $META_FILE"
              # Enable Android platform in the meta file
              # Replace "Android: {enabled: 0" with "Android: {enabled: 1"
              sed -i 's/Android:\s*$/Android:/' "$META_FILE"
              sed -i 's/enabled: 0/enabled: 1/g' "$META_FILE"
              # Make sure isPreloaded is set
              sed -i 's/isPreloaded: 0/isPreloaded: 1/' "$META_FILE"
            else
              echo "  No meta file, creating one..."
              GUID=$(cat /proc/sys/kernel/random/uuid | tr -d '-' | head -c 32)
              cat > "$META_FILE" << METAEOF
          fileFormatVersion: 2
          guid: ${GUID}
          PluginImporter:
            externalObjects: {}
            serializedVersion: 2
            iconMap: {}
            executionOrder: {}
            defineConstraints: []
            isPreloaded: 1
            isOverridable: 0
            isExplicitlyReferenced: 0
            validateReferences: 1
            platformData:
            - first:
                Android: Android
              second:
                enabled: 1
                settings:
                  CPU: ARMv7
            - first:
                Any:
              second:
                enabled: 0
                settings: {}
            - first:
                Editor: Editor
              second:
                enabled: 0
                settings:
                  DefaultValueInitialized: true
            userData:
            userDataPath:
            assetBundleName:
            assetBundleVariant:
          METAEOF
            fi
          done
          # List what we found
          echo "=== All .so files in project ==="
          find ExportedProject/Assets -name "*.so" | head -20

      - name: Fix StringTables / localization
        run: |
          set -e
          echo "=== Fixing StringTables ==="
          # The game looks for StringTables/english.json in StreamingAssets
          # Find it and make sure it's in the right place
          FOUND=$(find ExportedProject/Assets -path "*StringTable*" -o -path "*stringtable*" -o -name "english.json" | head -10)
          echo "Found StringTable files: $FOUND"
          # Ensure StreamingAssets directory exists and has the language files
          mkdir -p ExportedProject/Assets/StreamingAssets/StringTables
          # Copy any english.json we find
          find ExportedProject/Assets -name "english.json" -not -path "*/StreamingAssets/*" | while read F; do
            echo "Copying $F to StreamingAssets/StringTables/"
            cp "$F" ExportedProject/Assets/StreamingAssets/StringTables/english.json
          done
          # If still not found, check Resources
          if [ ! -f "ExportedProject/Assets/StreamingAssets/StringTables/english.json" ]; then
            echo "english.json not found in Assets, checking all json files..."
            find ExportedProject -name "*english*" -o -name "*English*" | head -10
          fi
          ls -la ExportedProject/Assets/StreamingAssets/StringTables/ 2>/dev/null || echo "No StringTables dir created"

      - name: Pull Unity Android editor image
        run: docker pull unityci/editor:ubuntu-2020.3.48f1-android-3

      - name: Build APK with pre-activated license
        run: |
          set -e
          echo "=== Injecting license file ==="
          ls -la UnityEntitlementLicense.xml
          grep -o "com.unity.editor[^\"]*" UnityEntitlementLicense.xml || true

          docker run --rm \
            -v "$PWD/ExportedProject":/project \
            -v "$PWD/UnityEntitlementLicense.xml":/root/.config/unity3d/Unity/licenses/UnityEntitlementLicense.xml:ro \
            -w /project \
            unityci/editor:ubuntu-2020.3.48f1-android-3 \
            bash -c '
              echo "=== License verification ==="
              grep -o "com.unity.editor[^\"]*" /root/.config/unity3d/Unity/licenses/UnityEntitlementLicense.xml || true

              echo "=== Native plugins check ==="
              find /project/Assets -name "*.so" | head -20
              find /project/Assets -name "*.bank" | head -10

              echo "=== Running Unity build ==="
              /opt/unity/Editor/Unity \
                -batchmode -nographics -quit \
                -projectPath /project \
                -executeMethod AndroidBuilder.BuildAndroid \
                -logFile /dev/stdout \
                -buildTarget Android
              echo "=== Build artifacts ==="
              ls -la /project/Build/ || true
              chown -R $(stat -c "%u:%g" /project) /project/Build || true
            '

      - name: List build output
        if: always()
        run: |
          sudo chown -R $USER:$USER ExportedProject/Build 2>/dev/null || true
          ls -la ExportedProject/Build/ || true
          find ExportedProject/Build -name '*.apk' -ls || true

      - name: Create Release and Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE=$(find ExportedProject/Build -name '*.apk' | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "No APK found!"
            exit 1
          fi
          APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
          echo "APK: $APK_FILE ($APK_SIZE)"
          TAG="v1.1.4-android-$(date +%Y%m%d%H%M%S)"
          gh release create "$TAG" "$APK_FILE" \
            --title "Untitled Goose Game - Android APK (ARMv7 32-bit)" \
            --notes "32-bit ARMv7 Android APK built from Unity 2020.3.48f1

          APK size: $APK_SIZE
          Architecture: ARMv7 (32-bit)
          Min SDK: 22 (Android 5.1)
          Target SDK: 30 (Android 11)
          
          Fixes: FMOD audio, StringTables localization" \
            --latest
          echo "Release created: $TAG"
