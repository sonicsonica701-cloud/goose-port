name: Find FMOD libs
on: workflow_dispatch
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd
      - name: Extract and find FMOD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ASSET_ID=$(cat project_asset_id.txt)
          curl -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/${ASSET_ID}" -o project.tar.zst
          zstd -d project.tar.zst -o project.tar && rm project.tar.zst
          tar -xf project.tar && rm project.tar
          echo "=== All .so files ==="
          find ExportedProject -name "*.so" 2>/dev/null
          echo "=== FMOD related files (not .cs) ==="
          find ExportedProject -iname "*fmod*" ! -name "*.cs" ! -name "*.meta" 2>/dev/null
          echo "=== Plugins directory structure ==="
          find ExportedProject/Assets/Plugins -type d 2>/dev/null | head -30
          echo "=== Looking for native libs in any form ==="
          find ExportedProject -name "*.dll" -path "*fmod*" -o -name "*.dylib" -path "*fmod*" 2>/dev/null
          echo "=== Check for FMOD settings ==="
          find ExportedProject -name "FMODStudioSettings*" 2>/dev/null
          cat ExportedProject/Assets/Resources/FMODStudioSettings.asset 2>/dev/null | head -20 || true
